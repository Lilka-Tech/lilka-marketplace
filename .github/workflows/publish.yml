name: Publish signed marketplace metadata
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    environment: marketplace-production
    runs-on: ubuntu-24.04
    steps:
      - name: Mint publisher installation token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ secrets.LILKA_MARKETPLACE_APP_ID }}
          private-key: ${{ secrets.LILKA_MARKETPLACE_APP_PRIVATE_KEY }}
          owner: Lilka-Tech
          repositories: lilka-marketplace
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          token: ${{ steps.app-token.outputs.token }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: npm run validate
      - run: npm run publish:metadata
        env:
          LILKA_MARKETPLACE_ED25519_PRIVATE_KEY: ${{ secrets.LILKA_MARKETPLACE_ED25519_PRIVATE_KEY }}
      - run: |
          git config user.name "lilka-marketplace[bot]"
          git config user.email "lilka-marketplace[bot]@users.noreply.github.com"
          printf '%s' "$LILKA_MARKETPLACE_GIT_SIGNING_KEY" > "$RUNNER_TEMP/signing-key"
          chmod 600 "$RUNNER_TEMP/signing-key"
          git config gpg.format ssh
          git config user.signingkey "$RUNNER_TEMP/signing-key"
          git add catalog metadata
          git diff --cached --quiet || git commit -S -m "chore(catalog): publish signed metadata"
          git push
        env:
          LILKA_MARKETPLACE_GIT_SIGNING_KEY: ${{ secrets.LILKA_MARKETPLACE_GIT_SIGNING_KEY }}
